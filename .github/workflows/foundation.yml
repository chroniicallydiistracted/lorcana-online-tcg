name: Foundation qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the same isolated local pipeline
        env:
          LORCANA_CI_ARTIFACT_DIR: .local/ci-upload
        run: python3 scripts/ci-local.py
      - name: Preserve identified foundation build evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: foundation-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/ci-upload/artifacts/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
