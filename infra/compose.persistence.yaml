# Disposable proof only. Never run this against the VS Code Compose project.
services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    pull_policy: never
    command: ["postgres", "-c", "log_min_duration_statement=0", "-c", "log_min_duration_sample=0", "-c", "log_transaction_sample_rate=1"]
    env_file: ../.env.local
    volumes:
      - proof_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s
    shm_size: 128mb
  runner:
    image: ${LORCANA_PROOF_WORKSPACE_IMAGE:?Discovered existing qualified workspace image required}
    pull_policy: never
    user: node
    working_dir: /workspaces/lorcana-online-tcg
    env_file: ../.env.local
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      LORCANA_PERSISTENCE_PROOF: "disposable"
    volumes:
      - type: bind
        source: ..
        target: /workspaces/lorcana-online-tcg
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  proof_data:
